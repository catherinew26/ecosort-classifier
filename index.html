
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EcoSort - Waste Identifier</title>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

  <!-- Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f7f3;
      text-align: center;
      padding: 20px;
      color: #26382b;
    }

    .container {
      background: white;
      max-width: 420px;
      margin: auto;
      padding: 25px;
      border-radius: 18px;
    }

    h1 {
      color: #287447;
    }

    button {
      background: #287447;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aab9ae;
      cursor: not-allowed;
    }

    img {
      max-width: 100%;
      max-height: 260px;
      margin-top: 15px;
      border-radius: 12px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #eaf4ec;
      display: none;
    }

    #category {
      font-size: 25px;
      font-weight: bold;
    }

    #status {
      margin: 15px;
      color: #555;
    }

    /* ERROR MESSAGE DESIGN */

    #errorBox {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #fff3e8;
      border: 1px solid #e8c9a8;
      border-radius: 12px;
      color: #704b2e;
    }

    #errorTitle {
      font-size: 18px;
      font-weight: bold;
      margin-top: 0;
    }

    #errorMessage {
      font-size: 14px;
      line-height: 1.5;
    }

    #errorAction {
      background: #287447;
    }

    #retryModelButton {
      display: none;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>EcoSort</h1>

    <p>
      Take a photo of your waste item to find out
      how to dispose of it.
    </p>

    <p id="status">Loading AI model...</p>

    <!-- PHOTO SELECTION -->

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      capture="environment"
    >

    <br>

    <!-- IMAGE PREVIEW -->

    <img
      id="preview"
      style="display:none;"
      alt="Selected waste item"
    >

    <br>

    <!-- IDENTIFY BUTTON -->

    <button
      id="identifyButton"
      disabled
      onclick="classifyImage()"
    >
      Identify My Waste
    </button>

    <!-- RETRY MODEL BUTTON -->

    <button
      id="retryModelButton"
      onclick="loadModel()"
    >
      Retry Loading Model
    </button>

    <!-- ERROR MESSAGE -->

    <div id="errorBox" role="alert">

      <p id="errorTitle"></p>

      <p id="errorMessage"></p>

      <button id="errorAction">
        Try Again
      </button>

    </div>

    <!-- RESULTS -->

    <div id="result">

      <h3>Identified Item</h3>

      <p id="item"></p>

      <p id="confidence"></p>

      <hr>

      <p>Your disposal category:</p>

      <div id="category"></div>

      <p id="instructions"></p>

    </div>

  </div>

  <script>

    // MODEL SETTINGS

    const MODEL_URL =
      "https://teachablemachine.withgoogle.com/models/lBQTKwlfc/";

    const CONFIDENCE_THRESHOLD = 0.70;

    let model = null;
    let selectedFile = null;
    let currentImageURL = null;

    // ELEMENT REFERENCES

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const identifyButton = document.getElementById("identifyButton");
    const retryModelButton = document.getElementById("retryModelButton");

    // UPDATE IDENTIFY BUTTON

    function updateIdentifyButton() {

      identifyButton.disabled = !model;
     

    }

    // ERROR MESSAGE SYSTEM

    function showError(title, message, buttonText, action) {

      document.getElementById("errorTitle").innerText = title;

      document.getElementById("errorMessage").innerText = message;

      const errorAction = document.getElementById("errorAction");

      errorAction.innerText = buttonText;

      errorAction.onclick = action;

      document.getElementById("errorBox").style.display = "block";

      document.getElementById("result").style.display = "none";

    }

    function hideError() {

      document.getElementById("errorBox").style.display = "none";

    }

    // LOAD AI MODEL

    async function loadModel() {

      model = null;

      updateIdentifyButton();

      retryModelButton.disabled = true;

      retryModelButton.style.display = "none";

      document.getElementById("status").innerText =
        "Loading AI model...";

      hideError();

      try {

        model = await tmImage.load(
          MODEL_URL + "model.json",
          MODEL_URL + "metadata.json"
        );

        document.getElementById("status").innerText =
          "AI model ready! Please upload a photo.";

      } catch (error) {

        model = null;

        document.getElementById("status").innerText =
          "Unable to load the AI model.";

        showError(
          "Model loading failed",
          "EcoSort couldn't load its identification system. Please check your internet connection and try again.",
          "Retry",
          loadModel
        );

        retryModelButton.style.display = "inline-block";

        console.error("Model loading error:", error);

      }

      retryModelButton.disabled = false;

      updateIdentifyButton();

    }

    // PHOTO SELECTION

    imageInput.addEventListener("change", function(event) {

      const file = event.target.files[0];

      hideError();

      document.getElementById("result").style.display = "none";

      selectedFile = null;

      updateIdentifyButton();

      if (currentImageURL) {

        URL.revokeObjectURL(currentImageURL);

        currentImageURL = null;

      }

      preview.style.display = "none";

      preview.removeAttribute("src");

      if (!file) {

        document.getElementById("status").innerText =
          "Please select a photo.";

        return;

      }

      // CHECK FILE TYPE

      if (!file.type.startsWith("image/")) {

        showError(
          "Invalid file",
          "Please select an image file to identify your waste.",
          "Choose Photo",
          function() {
            imageInput.click();
          }
        );

        return;

      }

      selectedFile = file;

      currentImageURL = URL.createObjectURL(file);

      preview.onload = function() {

        preview.style.display = "block";

        document.getElementById("status").innerText =
          "Photo ready! You can now identify your item.";

        updateIdentifyButton();

      };

      preview.onerror = function() {

        selectedFile = null;

        preview.style.display = "none";

        document.getElementById("status").innerText =
          "Unable to display this photo.";

        showError(
          "Photo couldn't be loaded",
          "Something went wrong while opening your image. Please choose another photo.",
          "Choose Another Photo",
          function() {
            imageInput.click();
          }
        );

        updateIdentifyButton();

      };

      preview.src = currentImageURL;

    });

    // DISPOSAL RULES

    function getDisposalRule(itemName) {

      const rules = {

        "Class 1: Plastic Bottle": {
          category: "RECYCLABLE",
          instructions: "Empty and rinse the bottle. Follow local rules for caps."
        },

        "Class 2: Glass Bottle": {
          category: "RECYCLABLE",
          instructions: "Empty the container and follow local glass recycling rules."
        },

        "Class 3: Aluminum Can": {
          category: "RECYCLABLE",
          instructions: "Empty the can and place it in the appropriate recycling bin."
        },

        "Class 4: Cardboard": {
          category: "RECYCLABLE",
          instructions: "Keep cardboard clean and dry. Flatten before recycling."
        },

        "Class 5: Food Wrapper": {
          category: "TRASH",
          instructions: "Place in your waste bin."
        },

        "Class 6: Glass Jar": {
          category: "RECYCLABLE",
          instructions: "Empty the container and follow local glass recycling rules."
        },

        "Class 7: Banana Peel": {
          category: "COMPOST",
          instructions: "Place in your approved food waste or compost collection."
        }

      };

      return rules[itemName] || null;

    }

    // CLASSIFY IMAGE

    async function classifyImage() {

      hideError();

      document.getElementById("result").style.display = "none";

      // CHECK PHOTO

      if (!selectedFile) {

        showError(
          "No photo selected",
          "Please choose a photo of the waste item you'd like to identify.",
          "Choose Photo",
          function() {
            imageInput.click();
          }
        );

        return;

      }

      // CHECK MODEL

      if (!model) {

        showError(
          "AI model unavailable",
          "The identification system isn't ready. Please try loading it again.",
          "Retry",
          loadModel
        );

        return;

      }

      // CHECK IMAGE

      if (!preview.complete || preview.naturalWidth === 0) {

        showError(
          "Photo unavailable",
          "EcoSort couldn't read your photo. Please select another image.",
          "Choose Another Photo",
          function() {
            imageInput.click();
          }
        );

        return;

      }

      identifyButton.disabled = true;

      document.getElementById("status").innerText =
        "Identifying your item...";

      try {

        // GET AI PREDICTIONS

        const predictions = await model.predict(preview);

        if (!predictions || predictions.length === 0) {

          throw new Error("No predictions returned by the model.");

        }

        // SORT PREDICTIONS

        predictions.sort(
          (a, b) => b.probability - a.probability
        );

        const best = predictions[0];

        const itemName = best.className;

        const confidence = best.probability;

        // CHECK CONFIDENCE

        if (
          typeof confidence !== "number" ||
          !Number.isFinite(confidence) ||
          confidence < 0 ||
          confidence > 1
        ) {

          throw new Error("Invalid confidence score.");

        }

        if (confidence < CONFIDENCE_THRESHOLD) {

          document.getElementById("status").innerText =
            "Identification uncertain.";

          showError(
            "We're not quite sure!",
            "EcoSort couldn't confidently identify this item. Try taking another photo with better lighting and a clear view of the item.",
            "Try Another Photo",
            function() {
              imageInput.click();
            }
          );

          return;

        }

        // GET DISPOSAL RULE

        const disposal = getDisposalRule(itemName);

        // DISPLAY IDENTIFIED ITEM

        document.getElementById("item").innerText =
          itemName;

        document.getElementById("confidence").innerText =
          "AI confidence: " + (confidence * 100).toFixed(1) + "%";

        if (disposal) {

          document.getElementById("category").innerText =
            disposal.category;

          document.getElementById("instructions").innerText =
            disposal.instructions;

        } else {

          document.getElementById("category").innerText =
            "CHECK LOCAL RULES";

          document.getElementById("instructions").innerText =
            "We recognised this item, but we don't currently have verified disposal guidance for it.";

        }

        document.getElementById("result").style.display =
          "block";

        document.getElementById("status").innerText =
          "Identification complete!";

      } catch (error) {

        console.error("Identification error:", error);

        document.getElementById("status").innerText =
          "Identification failed.";

        showError(
          "Something went wrong",
          "EcoSort couldn't identify your photo. Please try again. If the problem continues, reload the app.",
          "Try Again",
          function() {
            classifyImage();
          }
        );

      } finally {

        updateIdentifyButton();

      }

    }

    // START THE MODEL

    loadModel();

  </script>

</body>

</html>
